services:

  # ====================================================
  # SERVICIO DEL BACKEND (Django API)
  # ====================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: menu_digital_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - DEBUG=1
    env_file:
      - ./backend/.env

  # ====================================================
  # SERVICIO DEL FRONTEND (React + Vite)
  # ====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: menu_digital_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
