services:
  # ====================================================
  # SERVICIO DE BASE DE DATOS (MariaDB)
  # ====================================================
  db:
    image: mariadb:10.11
    container_name: menu_digital_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # ====================================================
  # SERVICIO DE GESTOR DE BD (phpMyAdmin)
  # ====================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: menu_digital_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${PMA_PORT}:80"

  # ====================================================
  # SERVICIO DEL BACKEND (Django API)
  # ====================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: menu_digital_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - db
    environment:
      - DEBUG=1

  # ====================================================
  # SERVICIO DEL FRONTEND (React + Vite)
  # ====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: menu_digital_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

# ====================================================
# VOLUMENES PERSISTENTES
# ====================================================
volumes:
  mariadb_data:
